<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Bookings — Mane Maison</title>
    <meta name="theme-color" content="#5e0a2b" />
    <link rel="icon" href="logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="bookings">
    <main class="pg wrap">
      <section class="two">
        <div>
          <h1>Book the studio</h1>
          <br />
          <p>
            Pick one or more services, a stylist, a day and a free time. Longer services
            block the time they need. We confirm on WhatsApp.
          </p>
        </div>
        <form id="bf">
          <div id="svc"></div>
          <p class="selnote" id="sel"></p>
          <label class="fl">Stylist<select id="sty" aria-label="Stylist"></select></label
          ><input type="date" id="dt" required aria-label="Date" />
          <div class="slots" id="sl"></div>
          <input name="n" placeholder="Full name" required /><input
            name="p"
            type="tel"
            placeholder="Phone"
            required
          /><input name="e" type="email" placeholder="Email (needed to pay online)" />
          <div class="g2 codes">
            <input id="dc" placeholder="Discount code" autocomplete="off" /><input
              id="gc"
              placeholder="Gift card code"
              autocomplete="off"
            />
          </div>
          <p><button type="button" class="ghost" id="ap">Apply codes</button></p>
          <div class="sumbox" id="bill"></div>
          <fieldset class="pay" id="depay" hidden>
            <legend>Pay your deposit</legend>
            <p class="meta" id="depnote"></p>
            <label
              ><input type="radio" name="m" value="online" checked /> Card or Mobile Money
              (online)</label
            ><label
              ><input type="radio" name="m" value="momo" /> Send Mobile Money to
              0537751108</label
            >
          </fieldset>
          <input name="t" id="btx" placeholder="Mobile Money transaction ID" hidden />
          <button>Confirm booking</button>
          <div class="sumbox" id="done" hidden></div>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
