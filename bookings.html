<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Bookings — Mane Maison</title>
    <meta name="theme-color" content="#5e0a2b" />
    <link rel="icon" href="logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="bookings">
    <main class="pg wrap">
      <section class="two">
        <div>
          <h1>Book the studio</h1>
          <br />
          <p>
            Pick one or more services from any category, then a day and a free slot. We
            confirm on WhatsApp.
          </p>
        </div>
        <form id="bf">
          <div id="svc"></div>
          <p class="selnote" id="sel"></p>
          <input type="date" id="dt" required aria-label="Date" />
          <div class="slots" id="sl"></div>
          <input name="n" placeholder="Full name" required /><input
            name="p"
            type="tel"
            placeholder="Phone"
            required
          /><button>Confirm booking</button>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
