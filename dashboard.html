<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Dashboard — Mane Maison</title>
    <meta name="theme-color" content="#5e0a2b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin" data-admin="dashboard">
    <main class="pg wrap">
      <form id="gate" class="bar">
        <h2>CEO Access</h2>
        <input
          id="pin"
          type="password"
          placeholder="Passcode"
          autocomplete="current-password"
        /><button id="lock">Unlock</button>
      </form>
      <div id="main" hidden></div>
    </main>
    <script src="app.js"></script>
    <script src="admin-tools.js"></script>
    <script src="admin-studio.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
